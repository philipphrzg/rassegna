name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/rassegna.apk

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: rassegna-apk
          path: out/rassegna.apk

      # La release serve per scaricare l'APK direttamente dal telefono,
      # con un link normale e senza dover fare login su GitHub.
      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rassegna build ${{ github.run_number }}
          body: |
            APK di debug generato automaticamente.
            Scarica `rassegna.apk`, aprilo sul telefono e consenti l'installazione da fonti sconosciute.
          files: out/rassegna.apk
          make_latest: true
